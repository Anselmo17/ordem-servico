name: Publicar no GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - index.html
      - style.css
      - funcionalidades/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos públicos do site
        run: |
          mkdir site
          mkdir -p site/funcionalidades/ordem-servico
          mkdir -p site/funcionalidades/nota-fiscal
          cp index.html style.css site/
          cp funcionalidades/ordem-servico/index.html funcionalidades/ordem-servico/style.css funcionalidades/ordem-servico/script.js funcionalidades/ordem-servico/ordemServicoTemplate.js site/funcionalidades/ordem-servico/
          cp funcionalidades/nota-fiscal/index.html funcionalidades/nota-fiscal/style.css funcionalidades/nota-fiscal/script.js funcionalidades/nota-fiscal/notaFiscalTemplate.js funcionalidades/nota-fiscal/pdf-lib.min.js funcionalidades/nota-fiscal/pdf-lib.LICENSE.md site/funcionalidades/nota-fiscal/

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@v4
