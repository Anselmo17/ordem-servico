name: Publicar no GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - index.html
      - style.css
      - script.js
      - ordemServicoTemplate.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar os arquivos públicos do site
        run: |
          mkdir site
          cp index.html style.css script.js ordemServicoTemplate.js site/

      - name: Enviar artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publicar o site
        id: deploy
        uses: actions/deploy-pages@v4
